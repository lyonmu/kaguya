<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Token Usage Analytics Prototype</title>
<style>
  :root{
    --bg:#f7f8fa;
    --card:#ffffff;
    --text:#17191d;
    --muted:#7c828d;
    --border:#e9ebef;
    --soft:#f2f4f7;
    --blue-1:#d7edff;
    --blue-2:#8fcdf7;
    --blue-3:#4c9ff0;
    --blue-4:#1769e0;
    --heat-0:#f1f3f5;
    --heat-1:#dce8f9;
    --heat-2:#b9d0f1;
    --heat-3:#84ace5;
    --heat-4:#4f82d8;
    --heat-5:#1d63c8;
    --shadow:0 1px 2px rgba(16,24,40,.02),0 10px 30px rgba(16,24,40,.04);
  }

  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit}
  .page{
    width:min(1480px,calc(100% - 48px));
    margin:0 auto;
    padding:36px 0 64px;
  }
  .topbar{
    display:flex;
    align-items:end;
    justify-content:space-between;
    gap:24px;
    margin-bottom:20px;
  }
  .title h1{font-size:24px;margin:0 0 6px;font-weight:700;letter-spacing:-.02em}
  .title p{font-size:14px;margin:0;color:var(--muted)}
  .range{
    display:flex;align-items:center;gap:8px;
    padding:7px 10px;border:1px solid var(--border);background:#fff;border-radius:10px;
    color:#5f6670;font-size:13px;
  }

  .summary-card{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    background:var(--card);
    border:1px solid var(--border);
    border-radius:22px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .metric{
    min-height:124px;
    padding:24px 28px;
    position:relative;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .metric:not(:last-child)::after{
    content:"";
    position:absolute;
    right:0;top:24px;bottom:24px;width:1px;background:var(--border);
  }
  .metric-value{
    font-size:30px;
    line-height:1;
    font-weight:650;
    letter-spacing:-.035em;
    font-variant-numeric:tabular-nums;
    margin-bottom:11px;
  }
  .metric-label{font-size:14px;color:var(--muted)}
  .metric-sub{font-size:12px;color:#9aa0a9;margin-top:6px}

  .card{
    margin-top:20px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:22px;
    box-shadow:var(--shadow);
    padding:24px 26px;
  }
  .card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    margin-bottom:22px;
  }
  .card-title{display:flex;align-items:baseline;gap:10px}
  .card-title h2{font-size:18px;margin:0;font-weight:650}
  .card-title span{font-size:12px;color:#a0a5ad}
  .segmented{
    display:flex;
    background:#f4f5f7;
    border-radius:10px;
    padding:3px;
    gap:2px;
  }
  .segmented button{
    border:0;background:transparent;color:#8b9098;
    padding:7px 13px;border-radius:8px;cursor:pointer;font-size:13px;
    transition:.16s ease;
  }
  .segmented button.active{
    background:#fff;color:#1f2329;box-shadow:0 1px 4px rgba(0,0,0,.06);
    font-weight:600;
  }

  /* heatmap */
  .heatmap-wrap{overflow-x:auto;padding-bottom:2px}
  .heatmap-stage{min-width:1040px}
  .heatmap-shell{display:flex;align-items:flex-start;gap:12px}
  .weekday-labels{
    width:26px;display:grid;grid-template-rows:repeat(7,18px);gap:6px;
    padding-top:0;color:#a2a7af;font-size:11px;
  }
  .weekday-labels span{display:flex;align-items:center}
  .heatmap{
    display:grid;
    gap:6px;
    min-height:162px;
    align-content:start;
  }
  .heatmap.daily{
    grid-template-rows:repeat(7,18px);
    grid-auto-flow:column;
    grid-auto-columns:18px;
  }
  .heatmap.weekly{
    grid-template-columns:repeat(52,1fr);
    gap:7px;
    min-height:86px;
    align-items:end;
  }
  .heatmap.monthly{
    grid-template-columns:repeat(12,1fr);
    gap:10px;
    min-height:94px;
    align-items:end;
  }
  .heat-cell{
    width:18px;height:18px;border-radius:5px;background:var(--heat-0);
    transition:transform .12s ease,filter .12s ease;
    position:relative;
  }
  .heat-cell:hover{transform:translateY(-1px) scale(1.08);filter:saturate(1.08)}
  .weekly .heat-cell{width:100%;height:48px;border-radius:7px}
  .monthly .heat-cell{width:100%;height:60px;border-radius:9px}
  .heat-label-row{
    position:relative;
    height:28px;margin-left:38px;margin-top:10px;
    color:#9298a1;font-size:12px;
  }
  .heat-label{
    position:absolute;transform:translateX(-2px);white-space:nowrap;
  }
  .heat-legend{
    display:flex;align-items:center;justify-content:flex-end;gap:6px;
    margin-top:16px;color:#a0a5ad;font-size:11px;
  }
  .legend-cell{width:13px;height:13px;border-radius:4px}

  /* chart */
  .chart-toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .legend{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .legend-item{display:flex;align-items:center;gap:7px;color:#777e88;font-size:12px}
  .dot{width:10px;height:10px;border-radius:3px}
  .chart-card{padding-bottom:20px}
  .chart{
    height:390px;
    display:grid;
    grid-template-columns:56px 1fr;
    grid-template-rows:1fr 44px;
    margin-top:10px;
  }
  .y-axis{
    grid-column:1;grid-row:1;
    position:relative;color:#9298a1;font-size:11px;font-variant-numeric:tabular-nums;
  }
  .y-tick{
    position:absolute;right:10px;transform:translateY(50%);
  }
  .plot{
    grid-column:2;grid-row:1;
    position:relative;
    border-bottom:1px solid #dfe3e9;
  }
  .gridline{
    position:absolute;left:0;right:0;height:1px;background:#eef0f3;
  }
  .bars{
    position:absolute;inset:0 10px 0 10px;
    display:flex;
    align-items:flex-end;
    justify-content:space-around;
    gap:20px;
  }
  .bar-group{
    height:100%;
    flex:1;
    max-width:118px;
    min-width:56px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    position:relative;
  }
  .bar-total{
    position:absolute;
    bottom:calc(var(--bar-h) + 8px);
    left:50%;transform:translateX(-50%);
    color:#59606a;font-size:11px;font-weight:600;
    white-space:nowrap;font-variant-numeric:tabular-nums;
    transition:bottom .25s ease;
  }
  .bar-stack{
    width:min(54px,72%);
    height:var(--bar-h);
    display:flex;
    flex-direction:column-reverse;
    border-radius:7px 7px 2px 2px;
    overflow:hidden;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);
    transition:height .25s ease;
    cursor:default;
  }
  .bar-seg{width:100%;transition:filter .12s ease}
  .bar-stack:hover .bar-seg{filter:saturate(1.08)}
  .x-axis{
    grid-column:2;grid-row:2;
    display:flex;
    justify-content:space-around;
    padding:10px 10px 0;
    gap:20px;
    color:#6f7680;font-size:12px;
  }
  .x-label{
    flex:1;max-width:118px;min-width:56px;
    text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  .tooltip{
    position:fixed;
    z-index:9999;
    display:none;
    pointer-events:none;
    min-width:220px;
    background:rgba(255,255,255,.98);
    border:1px solid #e3e6ea;
    border-radius:14px;
    box-shadow:0 16px 48px rgba(20,28,40,.14);
    padding:13px 14px;
    font-size:12px;
    color:#5c636d;
  }
  .tooltip strong{
    display:block;color:#17191d;font-size:14px;margin-bottom:8px
  }
  .tip-row{display:flex;justify-content:space-between;gap:24px;line-height:1.9}
  .tip-row .left{display:flex;align-items:center;gap:7px}
  .tip-swatch{width:9px;height:9px;border-radius:3px}
  .tip-value{color:#20242a;font-weight:600;font-variant-numeric:tabular-nums}

  .section-note{
    margin-top:8px;color:#a1a6ae;font-size:11px;
  }

  @media(max-width:900px){
    .page{width:min(100% - 24px,1480px);padding-top:20px}
    .summary-card{grid-template-columns:repeat(2,1fr)}
    .metric:nth-child(2)::after{display:none}
    .metric:nth-child(-n+2){border-bottom:1px solid var(--border)}
    .topbar{align-items:flex-start;flex-direction:column}
  }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="title">
      <h1>Token 使用分析</h1>
      <p>模型调用、会话与 Token 消耗概览</p>
    </div>
    <div class="range">2025-09-10&nbsp;—&nbsp;2026-09-09 · 近一年</div>
  </div>

  <section class="summary-card">
    <div class="metric">
      <div class="metric-value">15.3亿</div>
      <div class="metric-label">累计 Token 数</div>
      <div class="metric-sub">全部模型累计使用量</div>
    </div>
    <div class="metric">
      <div class="metric-value">1.6亿</div>
      <div class="metric-label">日峰值 Token 数</div>
      <div class="metric-sub">2026-08-02</div>
    </div>
    <div class="metric">
      <div class="metric-value">26,842</div>
      <div class="metric-label">总会话次数</div>
      <div class="metric-sub">全部历史会话</div>
    </div>
    <div class="metric">
      <div class="metric-value">612</div>
      <div class="metric-label">日峰值会话次数</div>
      <div class="metric-sub">2026-08-02</div>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <div class="card-title">
        <h2>Token 活动</h2>
        <span id="heat-subtitle">每日 Token 使用强度</span>
      </div>
      <div class="segmented" id="heat-toggle">
        <button class="active" data-mode="daily">每日</button>
        <button data-mode="weekly">每周</button>
        <button data-mode="monthly">每月</button>
      </div>
    </div>

    <div class="heatmap-wrap">
      <div class="heatmap-stage">
        <div class="heatmap-shell">
          <div class="weekday-labels" id="weekdays">
            <span>一</span><span></span><span>三</span><span></span><span>五</span><span></span><span>日</span>
          </div>
          <div class="heatmap daily" id="heatmap"></div>
        </div>
        <div class="heat-label-row" id="heat-labels"></div>
      </div>
    </div>
    <div class="heat-legend">
      <span>少</span>
      <span class="legend-cell" style="background:var(--heat-0)"></span>
      <span class="legend-cell" style="background:var(--heat-1)"></span>
      <span class="legend-cell" style="background:var(--heat-2)"></span>
      <span class="legend-cell" style="background:var(--heat-3)"></span>
      <span class="legend-cell" style="background:var(--heat-4)"></span>
      <span class="legend-cell" style="background:var(--heat-5)"></span>
      <span>多</span>
    </div>
  </section>

  <section class="card chart-card">
    <div class="card-head chart-toolbar">
      <div class="card-title">
        <h2>Token 构成</h2>
        <span id="chart-subtitle">按模型统计</span>
      </div>
      <div class="segmented" id="chart-toggle">
        <button class="active" data-dimension="model">按模型</button>
        <button data-dimension="vendor">按厂商</button>
      </div>
    </div>

    <div class="legend">
      <div class="legend-item"><span class="dot" style="background:var(--blue-2)"></span>输入</div>
      <div class="legend-item"><span class="dot" style="background:var(--blue-4)"></span>输出</div>
      <div class="legend-item"><span class="dot" style="background:var(--blue-3)"></span>思考</div>
      <div class="legend-item"><span class="dot" style="background:var(--blue-1)"></span>缓存</div>
    </div>

    <div class="chart">
      <div class="y-axis" id="y-axis"></div>
      <div class="plot" id="plot">
        <div class="gridline" style="bottom:0%"></div>
        <div class="gridline" style="bottom:25%"></div>
        <div class="gridline" style="bottom:50%"></div>
        <div class="gridline" style="bottom:75%"></div>
        <div class="gridline" style="bottom:100%"></div>
        <div class="bars" id="bars"></div>
      </div>
      <div class="x-axis" id="x-axis"></div>
    </div>
    <div class="section-note">示例数据仅用于原型展示；柱状图按 输入 / 输出 / 思考 / 缓存 四类 Token 堆叠展示。</div>
  </section>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
  const css = getComputedStyle(document.documentElement);
  const colors = {
    input: css.getPropertyValue('--blue-2').trim(),
    output: css.getPropertyValue('--blue-4').trim(),
    thinking: css.getPropertyValue('--blue-3').trim(),
    cache: css.getPropertyValue('--blue-1').trim()
  };
  const heatColors = [0,1,2,3,4,5].map(i => css.getPropertyValue(`--heat-${i}`).trim());

  const tooltip = document.getElementById('tooltip');
  function showTooltip(html, ev){
    tooltip.innerHTML = html;
    tooltip.style.display = 'block';
    moveTooltip(ev);
  }
  function moveTooltip(ev){
    const pad = 14, w = tooltip.offsetWidth, h = tooltip.offsetHeight;
    let x = ev.clientX + 14, y = ev.clientY + 14;
    if (x + w + pad > innerWidth) x = ev.clientX - w - 14;
    if (y + h + pad > innerHeight) y = ev.clientY - h - 14;
    tooltip.style.left = x + 'px';
    tooltip.style.top = y + 'px';
  }
  function hideTooltip(){ tooltip.style.display='none'; }

  function formatToken(n){
    if(n >= 1e8) return (n/1e8).toFixed(n >= 1e9 ? 1 : 2).replace(/\.0$/,'') + '亿';
    if(n >= 1e4) return (n/1e4).toFixed(1).replace(/\.0$/,'') + '万';
    return n.toLocaleString('zh-CN');
  }

  // deterministic demo dataset
  function rand(seed){
    let x = Math.sin(seed * 999) * 43758.5453123;
    return x - Math.floor(x);
  }
  const end = new Date('2026-09-09T00:00:00');
  const dailyData = [];
  for(let i=364;i>=0;i--){
    const d = new Date(end);
    d.setDate(end.getDate()-i);
    const idx = 364-i;
    const weekday = d.getDay();
    const season = 0.50 + 0.34*Math.sin((idx-185)/365*Math.PI*2);
    const weekdayBoost = (weekday===0 || weekday===6) ? .48 : 1;
    const noise = .55 + rand(idx+77)*1.25;
    const burst = [0,38,84,137,182,245,293,326].some(x => Math.abs(x-idx)<2) ? 2.3 : 1;
    const value = Math.max(0, Math.round(4200000 * season * weekdayBoost * noise * burst));
    dailyData.push({date:d, value});
  }

  function intensity(v, max){
    if(v <= max*0.06) return 0;
    if(v <= max*0.18) return 1;
    if(v <= max*0.36) return 2;
    if(v <= max*0.58) return 3;
    if(v <= max*0.78) return 4;
    return 5;
  }

  const heatmap = document.getElementById('heatmap');
  const heatLabels = document.getElementById('heat-labels');
  const weekdays = document.getElementById('weekdays');
  const heatSubtitle = document.getElementById('heat-subtitle');

  function buildDaily(){
    heatmap.className = 'heatmap daily';
    weekdays.style.display = 'grid';
    heatmap.innerHTML = '';
    heatLabels.innerHTML = '';
    const max = Math.max(...dailyData.map(x=>x.value));

    // Align Monday first: add leading blanks
    const first = dailyData[0].date;
    const mondayIndex = (first.getDay()+6)%7;
    for(let i=0;i<mondayIndex;i++){
      const blank = document.createElement('div');
      blank.className='heat-cell';
      blank.style.visibility='hidden';
      heatmap.appendChild(blank);
    }
    dailyData.forEach(x=>{
      const cell = document.createElement('div');
      cell.className='heat-cell';
      cell.style.background = heatColors[intensity(x.value,max)];
      const ds = `${x.date.getFullYear()}-${String(x.date.getMonth()+1).padStart(2,'0')}-${String(x.date.getDate()).padStart(2,'0')}`;
      cell.addEventListener('mouseenter',ev=>showTooltip(
        `<strong>${ds}</strong><div class="tip-row"><span class="left">Token</span><span class="tip-value">${x.value.toLocaleString('zh-CN')}</span></div>`, ev
      ));
      cell.addEventListener('mousemove',moveTooltip);
      cell.addEventListener('mouseleave',hideTooltip);
      heatmap.appendChild(cell);
    });

    // month labels positioned from week index
    const seen = new Set();
    dailyData.forEach((x, i)=>{
      if(x.date.getDate()<=7){
        const key = `${x.date.getFullYear()}-${x.date.getMonth()}`;
        if(!seen.has(key)){
          seen.add(key);
          const week = Math.floor((i + mondayIndex)/7);
          const lab = document.createElement('span');
          lab.className='heat-label';
          lab.textContent = `${x.date.getMonth()+1}月`;
          lab.style.left = `${week*24}px`;
          heatLabels.appendChild(lab);
        }
      }
    });
    heatSubtitle.textContent='每日 Token 使用强度';
  }

  function aggregateWeekly(){
    const out=[];
    for(let i=0;i<dailyData.length;i+=7){
      const arr=dailyData.slice(i,i+7);
      out.push({
        label:`第 ${out.length+1} 周`,
        start:arr[0].date,
        end:arr[arr.length-1].date,
        value:arr.reduce((s,x)=>s+x.value,0)
      });
    }
    return out.slice(-52);
  }

  function buildWeekly(){
    const data=aggregateWeekly();
    const max=Math.max(...data.map(x=>x.value));
    heatmap.className='heatmap weekly';
    weekdays.style.display='none';
    heatmap.innerHTML='';
    heatLabels.innerHTML='';
    data.forEach((x,i)=>{
      const cell=document.createElement('div');
      cell.className='heat-cell';
      cell.style.background=heatColors[intensity(x.value,max)];
      const a=`${x.start.getMonth()+1}/${x.start.getDate()}`;
      const b=`${x.end.getMonth()+1}/${x.end.getDate()}`;
      cell.addEventListener('mouseenter',ev=>showTooltip(
        `<strong>${a} — ${b}</strong><div class="tip-row"><span class="left">周 Token</span><span class="tip-value">${x.value.toLocaleString('zh-CN')}</span></div>`,ev
      ));
      cell.addEventListener('mousemove',moveTooltip);
      cell.addEventListener('mouseleave',hideTooltip);
      heatmap.appendChild(cell);
    });
    [0,4,9,13,17,22,26,30,35,39,43,48].forEach((idx)=>{
      const x=data[idx];
      if(!x) return;
      const lab=document.createElement('span');
      lab.className='heat-label';
      lab.textContent=`${x.start.getMonth()+1}月`;
      lab.style.left=`calc(${idx/52*100}% - 2px)`;
      heatLabels.appendChild(lab);
    });
    heatSubtitle.textContent='每周 Token 使用强度';
  }

  function aggregateMonthly(){
    const map = new Map();
    dailyData.forEach(x=>{
      const k=`${x.date.getFullYear()}-${String(x.date.getMonth()+1).padStart(2,'0')}`;
      if(!map.has(k)) map.set(k,0);
      map.set(k,map.get(k)+x.value);
    });
    return Array.from(map.entries()).slice(-12).map(([k,v])=>({label:k,value:v}));
  }

  function buildMonthly(){
    const data=aggregateMonthly();
    const max=Math.max(...data.map(x=>x.value));
    heatmap.className='heatmap monthly';
    weekdays.style.display='none';
    heatmap.innerHTML='';
    heatLabels.innerHTML='';
    data.forEach((x,i)=>{
      const cell=document.createElement('div');
      cell.className='heat-cell';
      cell.style.background=heatColors[intensity(x.value,max)];
      cell.addEventListener('mouseenter',ev=>showTooltip(
        `<strong>${x.label}</strong><div class="tip-row"><span class="left">月 Token</span><span class="tip-value">${x.value.toLocaleString('zh-CN')}</span></div>`,ev
      ));
      cell.addEventListener('mousemove',moveTooltip);
      cell.addEventListener('mouseleave',hideTooltip);
      heatmap.appendChild(cell);

      const lab=document.createElement('span');
      lab.className='heat-label';
      lab.textContent=`${Number(x.label.slice(5))}月`;
      lab.style.left=`calc(${i/12*100}% + ${100/24}%)`;
      lab.style.transform='translateX(-50%)';
      heatLabels.appendChild(lab);
    });
    heatSubtitle.textContent='每月 Token 使用强度';
  }

  document.getElementById('heat-toggle').addEventListener('click',e=>{
    if(e.target.tagName!=='BUTTON') return;
    [...e.currentTarget.children].forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active');
    const mode=e.target.dataset.mode;
    if(mode==='daily') buildDaily();
    if(mode==='weekly') buildWeekly();
    if(mode==='monthly') buildMonthly();
  });

  const modelData = [
    {name:'GPT-5.6 Sol', input:182000000, output:41000000, thinking:69000000, cache:126000000},
    {name:'Claude Sonnet 4.6', input:146000000, output:35000000, thinking:52000000, cache:101000000},
    {name:'Gemini 2.5 Pro', input:118000000, output:28000000, thinking:44000000, cache:76000000},
    {name:'GPT-5.6 Luna', input:94000000, output:24000000, thinking:22000000, cache:65000000},
    {name:'GLM-5.3', input:73000000, output:19000000, thinking:26000000, cache:51000000},
    {name:'Qwen3.5', input:59000000, output:16000000, thinking:18000000, cache:39000000}
  ];

  const vendorData = [
    {name:'OpenAI', input:276000000, output:65000000, thinking:91000000, cache:191000000},
    {name:'Anthropic', input:146000000, output:35000000, thinking:52000000, cache:101000000},
    {name:'Google', input:118000000, output:28000000, thinking:44000000, cache:76000000},
    {name:'Zhipu AI', input:73000000, output:19000000, thinking:26000000, cache:51000000},
    {name:'Alibaba Cloud', input:59000000, output:16000000, thinking:18000000, cache:39000000}
  ];

  const bars = document.getElementById('bars');
  const xAxis = document.getElementById('x-axis');
  const yAxis = document.getElementById('y-axis');
  const chartSubtitle = document.getElementById('chart-subtitle');

  function totalOf(d){return d.input+d.output+d.thinking+d.cache}

  function niceMax(max){
    const p=Math.pow(10,Math.floor(Math.log10(max)));
    const n=max/p;
    const nice=n<=1?1:n<=2?2:n<=5?5:10;
    return nice*p;
  }

  function renderBars(type){
    const data = type==='model' ? modelData : vendorData;
    const max = niceMax(Math.max(...data.map(totalOf)));
    bars.innerHTML='';
    xAxis.innerHTML='';
    yAxis.innerHTML='';

    [0,0.25,0.5,0.75,1].forEach(r=>{
      const tick=document.createElement('span');
      tick.className='y-tick';
      tick.style.bottom=`${r*100}%`;
      tick.textContent=formatToken(max*r);
      yAxis.appendChild(tick);
    });

    data.forEach(d=>{
      const total=totalOf(d);
      const group=document.createElement('div');
      group.className='bar-group';
      const h=total/max*100;
      group.style.setProperty('--bar-h',`${h}%`);

      const totalLabel=document.createElement('div');
      totalLabel.className='bar-total';
      totalLabel.textContent=formatToken(total);

      const stack=document.createElement('div');
      stack.className='bar-stack';
      stack.innerHTML=`
        <div class="bar-seg" style="height:${d.input/total*100}%;background:${colors.input}"></div>
        <div class="bar-seg" style="height:${d.output/total*100}%;background:${colors.output}"></div>
        <div class="bar-seg" style="height:${d.thinking/total*100}%;background:${colors.thinking}"></div>
        <div class="bar-seg" style="height:${d.cache/total*100}%;background:${colors.cache}"></div>
      `;

      stack.addEventListener('mouseenter',ev=>showTooltip(
        `<strong>${d.name} <span style="float:right">${formatToken(total)}</span></strong>
         <div class="tip-row"><span class="left"><i class="tip-swatch" style="background:${colors.input}"></i>输入</span><span class="tip-value">${formatToken(d.input)}</span></div>
         <div class="tip-row"><span class="left"><i class="tip-swatch" style="background:${colors.output}"></i>输出</span><span class="tip-value">${formatToken(d.output)}</span></div>
         <div class="tip-row"><span class="left"><i class="tip-swatch" style="background:${colors.thinking}"></i>思考</span><span class="tip-value">${formatToken(d.thinking)}</span></div>
         <div class="tip-row"><span class="left"><i class="tip-swatch" style="background:${colors.cache}"></i>缓存</span><span class="tip-value">${formatToken(d.cache)}</span></div>`,ev
      ));
      stack.addEventListener('mousemove',moveTooltip);
      stack.addEventListener('mouseleave',hideTooltip);

      group.appendChild(totalLabel);
      group.appendChild(stack);
      bars.appendChild(group);

      const lab=document.createElement('div');
      lab.className='x-label';
      lab.textContent=d.name;
      lab.title=d.name;
      xAxis.appendChild(lab);
    });

    chartSubtitle.textContent = type==='model' ? '按模型统计' : '按厂商统计';
  }

  document.getElementById('chart-toggle').addEventListener('click',e=>{
    if(e.target.tagName!=='BUTTON') return;
    [...e.currentTarget.children].forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active');
    renderBars(e.target.dataset.dimension);
  });

  buildDaily();
  renderBars('model');
</script>
</body>
</html>
