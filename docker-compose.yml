services:
  kaguya-svc:
    image: kaguya:latest
    container_name: kaguya-svc
    hostname: kaguya-svc
    restart: unless-stopped
    # Only the host loopback is published; expose the service through a TLS gateway instead.
    ports:
      - "127.0.0.1:9024:9024"
    healthcheck:
      test: ["CMD-SHELL", "pidof kaguya"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./kaguya-data:/data
      # Prepare this file before the first start; Docker would otherwise create a directory.
      - ./kaguya-key:/run/secrets/kaguya.key:ro
