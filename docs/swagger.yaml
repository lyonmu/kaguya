      - description: 文件名或相对路径
        in: query
        name: query
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/code.Response'
            - properties:
                data:
                  $ref: '#/definitions/project.FileSearchResp'
              type: object
      summary: 搜索项目中的文件，用于输入框 @ 引用
      tags:
      - Project
  /v1/project/{id}/git/diff:
    get:
      description: 输出相对 HEAD 的 diff；未跟踪文件按新增内容输出，最大 1MB，超出截断。非 Git 项目返回业务码 103004
      parameters:
      - description: 项目 ID
        in: path
        name: id
        required: true
        type: string
      - in: query
        maxLength: 4096
        name: path
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/code.Response'
            - properties:
                data:
                  $ref: '#/definitions/project.GitDiffResp'
              type: object
      summary: 单个变更文件的统一 diff
      tags:
      - Project
  /v1/project/{id}/git/status:
    get:
      description: 非 Git 目录或缺少 git 命令时返回 is_git=false 并携带 message，不视为错误
