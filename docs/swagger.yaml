    get:
      parameters:
      - description: 项目 ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/code.Response'
            - properties:
                data:
                  $ref: '#/definitions/project.Resp'
              type: object
      summary: 项目详情
      tags:
      - Project
    put:
      description: 名称可重复；不能修改为其他未删除项目使用的目录，冲突返回业务码 107003
      parameters:
      - description: 项目 ID
        in: path
        name: id
        required: true
        type: string
      - description: 项目信息
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/project.SaveReq'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/code.Response'
            - properties:
                data:
                  $ref: '#/definitions/project.Resp'
              type: object
      summary: 更新项目
      tags:
      - Project
  /v1/project/{id}/content:
    get:
      description: 最大读取 512KB，超出截断；二进制返回 binary=true 且不带内容
      parameters:
      - description: 项目 ID
        in: path
        name: id
        required: true
        type: string
      - in: query
        maxLength: 4096
        name: path
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/code.Response'
            - properties:
                data:
                  $ref: '#/definitions/project.ContentResp'
              type: object
