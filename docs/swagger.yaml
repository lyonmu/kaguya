basePath: /kaguya/api
definitions:
  chat.BlockPhase:
    enum:
    - start
    - delta
    - block_end
    type: string
    x-enum-varnames:
    - BlockPhaseStart
    - BlockPhaseDelta
    - BlockPhaseEnd
  chat.BlockType:
    enum:
    - text
    - reasoning
    - tool_call
    - tool_result
    type: string
    x-enum-varnames:
    - BlockTypeText
    - BlockTypeReasoning
    - BlockTypeToolCall
    - BlockTypeToolResult
  chat.Chat:
    properties:
      block:
        allOf:
        - $ref: '#/definitions/chat.ContentBlock'
        description: delta 帧的内容块事件；整轮 done 不携带内容
      content:
        description: 兼容字段：仅正文增量，与 block.text 二选一消费
        type: string
      flag:
        $ref: '#/definitions/chat.WSFlag'
      id:
        description: 会话雪花 ID；后续请求沿用此 ID 恢复上下文
        type: string
    type: object
  chat.ChatReq:
    properties:
      files:
        items:
          type: string
        maxItems: 8
        type: array
      flag:
        $ref: '#/definitions/chat.WSFlag'
      id:
        description: 会话ID，空值表示开启新对话
        type: string
      messages:
        type: string
      model_id:
        description: 本地模型记录 ID，空值使用全局默认模型
        type: string
      project_id:
        description: 仅新对话使用
        maxLength: 64
        type: string
    required:
    - flag
    - messages
    type: object
  chat.ChatResp:
    properties:
      api_protocol:
        allOf:
        - $ref: '#/definitions/consts.ProviderProtocol'
        description: api接口类型
      chat:
        allOf:
        - $ref: '#/definitions/chat.Chat'
        description: 对话信息
      created:
        description: 创建时间时间戳
        type: integer
      err:
        description: 错误信息
      finish_reason:
        description: stop 或 step_limit（已保存，可继续）
        type: string
      model_id:
        description: 模型id
        type: string
      model_name:
        description: 模型名称
        type: string
      usage:
        allOf:
        - $ref: '#/definitions/chat.Usage'
        description: token 使用信息
    type: object
  chat.ContentBlock:
    properties:
      error_message:
        type: string
      input:
        type: string
      is_error:
        type: boolean
      output:
        $ref: '#/definitions/chat.ToolOutput'
      phase:
        $ref: '#/definitions/chat.BlockPhase'
      provider_executed:
        type: boolean
      text:
        type: string
      tool_call_id:
        type: string
      tool_name:
        type: string
      type:
        $ref: '#/definitions/chat.BlockType'
    type: object
  chat.ConversationContextResp:
    properties:
      context_tokens:
        type: integer
      context_window:
        type: integer
      conversation_id:
        type: string
      effective_window:
        type: integer
      max_window_percent:
        type: number
      model_id:
        type: string
      model_name:
        type: string
      percent:
        type: number
      turn_index:
        type: integer
      window_ratio:
        type: number
    type: object
  chat.ConversationListResp:
    properties:
      items:
        items:
          $ref: '#/definitions/chat.ConversationResp'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  chat.ConversationResp:
    properties:
      created_at:
        type: string
      duration_ms:
        type: integer
      favorite:
        type: boolean
      id:
        type: string
      is_project:
        description: 根据 project_id 是否为空派生，不单独存储
        type: boolean
      last_message_at:
        type: string
      model_id:
        type: string
      model_name:
        type: string
      project_id:
        type: string
      title:
        description: AI 标题最多20字符；新会话创建后并行生成并异步写入，仍为“新对话”时由前端 POST title/wait 补生成或重试
        type: string
      tool_calls:
        type: integer
      turn_count:
        type: integer
      usage:
        allOf:
        - $ref: '#/definitions/chat.Usage'
        description: 仅累计已完成轮次
    type: object
  chat.ConversationTitleResp:
    properties:
      id:
        type: string
      title:
        description: 当前已保存标题；生成失败或等待超时保留原标题
        type: string
    type: object
  chat.ConversationUpdateReq:
    properties:
      favorite:
        type: boolean
      title:
        maxLength: 200
        minLength: 1
        type: string
    type: object
  chat.StoredBlock:
    properties:
      details_deferred:
        type: boolean
      end_order:
        type: integer
      error_message:
        type: string
      finished_at:
        type: string
      has_output:
        type: boolean
      input:
        type: string
      is_error:
        type: boolean
      output:
        $ref: '#/definitions/chat.ToolOutput'
      provider_executed:
        type: boolean
      sequence:
        description: 轮内展示顺序；与 turn_index 联合排序
        type: integer
      start_order:
        description: Trace 按事件序号还原并行开始/结束顺序
        type: integer
      started_at:
        type: string
      text:
        type: string
      tool_call_id:
        type: string
      tool_name:
        type: string
      type:
        $ref: '#/definitions/chat.BlockType'
    type: object
  chat.StoredTurn:
    properties:
      api_protocol:
        type: string
      blocks:
        items:
          $ref: '#/definitions/chat.StoredBlock'
        type: array
      duration_ms:
        type: integer
      finish_reason:
        type: string
      finished_at:
        type: string
      model_id:
        type: string
      model_name:
        type: string
      provider_name:
        type: string
      started_at:
        type: string
      status:
        description: running/completed/interrupted/failed；只有 completed 是完整上下文
        type: string
      tool_calls:
        type: integer
      turn_index:
        description: 仅历史分页/排序使用，不改变实时 DTO
        type: integer
      usage:
        $ref: '#/definitions/chat.Usage'
      user_content:
        type: string
    type: object
  chat.ToolOutput:
    properties:
      data:
        description: base64 媒体数据
        type: string
      media_type:
        type: string
      text:
        type: string
      type:
        $ref: '#/definitions/chat.ToolOutputType'
    type: object
  chat.ToolOutputType:
    enum:
    - text
    - error
    - media
    type: string
    x-enum-varnames:
    - ToolOutputText
    - ToolOutputError
    - ToolOutputMedia
  chat.TurnListResp:
    properties:
      has_more:
        type: boolean
      items:
        description: 按 turn_index 升序，每轮 blocks 按 sequence 升序
        items:
          $ref: '#/definitions/chat.StoredTurn'
        type: array
      next_before:
        description: 向前加载更早轮次的游标
        type: integer
      page:
        description: 页码模式为实际页码；游标模式为 0
        type: integer
      page_size:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  chat.Usage:
    properties:
      cached_tokens:
        description: 命中缓存的 Token 数
        type: integer
      input_tokens:
        description: 输入 Token 数。
        type: integer
      output_tokens:
        description: 输出 Token 数
        type: integer
      reasoning_tokens:
        description: 思考 Token 数（提供商未报告时为 0）
        type: integer
      total_tokens:
        description: 总 Token 数
        type: integer
    type: object
  chat.WSFlag:
    enum:
    - chat
    - cancel
    - start
    - delta
    - done
    - error
    type: string
    x-enum-comments:
      WSFlagCancel: 上行：取消当前生成
      WSFlagChat: 上行：发起一轮对话
      WSFlagDelta: 下行：增量内容帧
      WSFlagDone: 下行：唯一的本轮结束帧，仅携带 Usage，不重复内容
      WSFlagError: 下行：出错或被取消
      WSFlagStart: 下行：本轮首帧（会话 ID + 模型信息）
    x-enum-descriptions:
    - 上行：发起一轮对话
    - 上行：取消当前生成
    - 下行：本轮首帧（会话 ID + 模型信息）
    - 下行：增量内容帧
    - 下行：唯一的本轮结束帧，仅携带 Usage，不重复内容
    - 下行：出错或被取消
    x-enum-varnames:
    - WSFlagChat
    - WSFlagCancel
    - WSFlagStart
    - WSFlagDelta
    - WSFlagDone
    - WSFlagError
  code.Response:
    properties:
      code:
        example: 100000
        type: integer
      data: {}
      message:
        example: success
        type: string
    type: object
  consts.ProviderProtocol:
    enum:
    - openai-chat
    - anthropic
    - openai-response
    type: string
    x-enum-varnames:
    - ProtocolOpenAIChat
    - ProtocolAnthropic
    - ProtocolOpenAIResponses
  consts.ProviderType:
