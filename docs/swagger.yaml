        required: true
        schema:
          $ref: '#/definitions/project.SaveReq'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/code.Response'
            - properties:
                data:
                  $ref: '#/definitions/project.Resp'
              type: object
      summary: 新建主机目录项目（不创建主机文件夹）
      tags:
      - Project
  /v1/project/{id}:
    delete:
      parameters:
      - description: 项目 ID
        in: path
