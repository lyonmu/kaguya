basePath: /kaguya/api
definitions:
  chat.Chat:
    properties:
      content:
        description: 模型返回的内容
        type: string
      flag:
        $ref: '#/definitions/chat.WSFlag'
      id:
        description: 对话id
        type: string
    type: object
  chat.ChatReq:
    properties:
      flag:
        $ref: '#/definitions/chat.WSFlag'
      id:
        description: 会话ID，空值表示开启新对话
        type: string
      messages:
        type: string
    required:
    - flag
    - messages
    type: object
  chat.ChatResp:
    properties:
      api_protocol:
        allOf:
        - $ref: '#/definitions/consts.ProviderProtocol'
        description: api接口类型
      chat:
        allOf:
        - $ref: '#/definitions/chat.Chat'
        description: 对话信息
      created:
        description: 创建时间时间戳
        type: integer
      err:
        description: 错误信息
      model_id:
        description: 模型id
        type: string
      model_name:
        description: 模型名称
        type: string
      usage:
        allOf:
        - $ref: '#/definitions/chat.Usage'
        description: token 使用信息
    type: object
  chat.Usage:
    properties:
      cached_tokens:
        description: 命中缓存的 Token 数
        type: integer
      input_tokens:
        description: 输入 Token 数。
        type: integer
      output_tokens:
        description: 输出 Token 数
        type: integer
      total_tokens:
        description: 总 Token 数
        type: integer
    type: object
  chat.WSFlag:
    enum:
    - chat
    - cancel
    - start
    - delta
    - done
    - error
    type: string
    x-enum-comments:
      WSFlagCancel: 上行：取消当前生成
      WSFlagChat: 上行：发起一轮对话
      WSFlagDelta: 下行：增量内容帧
      WSFlagDone: 下行：本轮末帧（完整回答 + Usage）
      WSFlagError: 下行：出错或被取消
      WSFlagStart: 下行：本轮首帧（会话 ID + 模型信息）
    x-enum-descriptions:
    - 上行：发起一轮对话
    - 上行：取消当前生成
    - 下行：本轮首帧（会话 ID + 模型信息）
    - 下行：增量内容帧
    - 下行：本轮末帧（完整回答 + Usage）
    - 下行：出错或被取消
    x-enum-varnames:
    - WSFlagChat
    - WSFlagCancel
    - WSFlagStart
    - WSFlagDelta
    - WSFlagDone
    - WSFlagError
  consts.ProviderProtocol:
    enum:
    - openai-chat
    - anthropic
    - openai-response
    type: string
    x-enum-varnames:
    - ProtocolOpenAIChat
    - ProtocolAnthropic
    - ProtocolOpenAIResponses
  consts.ReasoningEffort:
    enum:
    - low
    - medium
    - high
    type: string
    x-enum-varnames:
    - ReasoningEffortLow
    - ReasoningEffortMedium
    - ReasoningEffortHigh
  consts.Status:
    enum:
    - -1
    - 1
    - 2
    type: integer
    x-enum-varnames:
    - IsUnknown
    - IsTrue
    - IsFalse
  github_com_lyonmu_kaguya_internal_dto_code.Response:
    properties:
      code:
        example: 100000
        type: integer
      data: {}
      message:
        example: success
        type: string
    type: object
  system.SystemAccessLogListResp:
    properties:
      items:
        description: 操作日志列表
        items:
          $ref: '#/definitions/system.SystemAccessLogResp'
        type: array
      page:
        description: 页码
        type: integer
      page_size:
        description: 每页条数
        type: integer
      total:
        description: 总条数
        type: integer
    type: object
  system.SystemAccessLogResp:
    properties:
      access_ip:
        description: 访问IP
        type: string
      access_time:
        description: 操作时间
        type: integer
      browser_engine_name:
        description: 浏览器引擎名称
        type: string
      browser_engine_version:
        description: 浏览器引擎版本
        type: string
      browser_name:
        description: 浏览器名称
        type: string
      browser_version:
        description: 浏览器版本
        type: string
      id:
        description: ID
        type: string
      os:
        description: 操作系统
        type: string
      platform:
        description: 操作平台
        type: string
    type: object
  system.SystemModelLabelResp:
    properties:
      label:
        type: string
      model_id:
        type: string
      provider_id:
        type: string
      value:
        type: string
    type: object
  system.SystemModelListResp:
    properties:
      items:
        items:
          $ref: '#/definitions/system.SystemModelResp'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  system.SystemModelResp:
    properties:
      capability_structured_output:
        $ref: '#/definitions/consts.Status'
      capability_tool_use:
        $ref: '#/definitions/consts.Status'
      capability_vision:
        $ref: '#/definitions/consts.Status'
      created_at:
        type: string
      id:
        type: string
      is_default:
        $ref: '#/definitions/consts.Status'
      model_id:
        type: string
      model_name:
        type: string
      provider_id:
        type: string
      provider_name:
        type: string
      reasoning_effort:
        $ref: '#/definitions/consts.ReasoningEffort'
      reasoning_enabled:
        $ref: '#/definitions/consts.Status'
      token_context_window:
        type: integer
      token_max_output_tokens:
        type: integer
      updated_at:
        type: string
    type: object
  system.SystemModelSaveReq:
    properties:
      capability_structured_output:
        allOf:
        - $ref: '#/definitions/consts.Status'
        enum:
        - 1
        - 2
      capability_tool_use:
        allOf:
        - $ref: '#/definitions/consts.Status'
        enum:
        - 1
        - 2
      capability_vision:
        allOf:
        - $ref: '#/definitions/consts.Status'
        enum:
        - 1
        - 2
      is_default:
        allOf:
        - $ref: '#/definitions/consts.Status'
        enum:
        - 1
        - 2
      model_id:
        type: string
      model_name:
        type: string
      provider_id:
        type: string
      reasoning_effort:
        allOf:
        - $ref: '#/definitions/consts.ReasoningEffort'
        enum:
        - low
        - medium
        - high
      reasoning_enabled:
        allOf:
        - $ref: '#/definitions/consts.Status'
        enum:
        - 1
        - 2
      token_context_window:
        minimum: 0
        type: integer
      token_max_output_tokens:
        minimum: 0
        type: integer
    required:
    - capability_structured_output
    - capability_tool_use
    - capability_vision
    - is_default
    - model_id
    - model_name
    - provider_id
    - reasoning_effort
    - reasoning_enabled
    type: object
  system.SystemProviderLabelResp:
    properties:
      label:
        type: string
      value:
        type: string
    type: object
  system.SystemProviderListResp:
    properties:
      items:
        items:
          $ref: '#/definitions/system.SystemProviderResp'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  system.SystemProviderResp:
    properties:
      api_key:
        type: string
      api_protocol:
        $ref: '#/definitions/consts.ProviderProtocol'
      base_url:
        type: string
      created_at:
        type: string
      id:
        type: string
      models:
        items:
          $ref: '#/definitions/system.SystemModelResp'
        type: array
      provider_name:
        type: string
      updated_at:
        type: string
    type: object
  system.SystemProviderSaveReq:
    properties:
      api_key:
        description: API Key
        type: string
      api_protocol:
        allOf:
        - $ref: '#/definitions/consts.ProviderProtocol'
        description: API 协议类型
        enum:
        - openai-chat
        - anthropic
        - openai-response
      base_url:
        description: Base URL
        type: string
      provider_name:
        description: 提供商名称
        type: string
    required:
    - api_protocol
    - provider_name
    type: object
host: http://localhost:9024
info:
  contact:
    email: lyonmu@foxmail.com
    name: Lyon Mu
    url: https://github.com/lyonmu
  description: kaguya 后端
  license:
    name: MIT
    url: https://github.com/lyonmu/kaguya/blob/master/LICENSE
  title: kaguya Swagger API接口文档
  version: v0.0.1
paths:
  /v1/chat/sse:
    post:
      description: 简单SSE对话：流式返回模型回答，首帧携带会话ID与模型信息，末帧携带完整内容与token用量
      parameters:
      - description: 用户发起的对话（conversation_id 为空时开启新对话）
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/chat.ChatReq'
      produces:
      - application/json
      responses:
        "200":
          description: SSE 流式响应，每帧为一个 ChatResp
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lyonmu_kaguya_internal_dto_code.Response'
            - properties:
                code:
                  type: number
                data:
                  $ref: '#/definitions/chat.ChatResp'
                message:
                  type: string
              type: object
      summary: ChatSSE
      tags:
      - Chat
  /v1/chat/ws:
    get:
      description: WebSocket 流式对话：长连接多轮对话。上行帧 ChatWSReq（flag=chat/cancel），下行帧 dtocode.Response
        包 ChatWSResp（flag=start/delta/done/error）
      produces:
      - application/json
      responses:
        "200":
          description: WS 帧，每帧为一个 dtocode.Response
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lyonmu_kaguya_internal_dto_code.Response'
            - properties:
                code:
                  type: number
                data:
                  $ref: '#/definitions/chat.ChatResp'
                message:
                  type: string
              type: object
      summary: ChatWS
      tags:
      - Chat
  /v1/system/accesslog/page:
    get:
      description: 获取访问日志分页列表
      parameters:
      - description: 访问IP
        in: query
        name: access_ip
        type: string
      - description: 结束时间
        in: query
        name: end_time
        type: integer
      - default: 1
        description: 页码
        in: query
        minimum: 1
        name: page
        required: true
        type: integer
      - default: 10
        description: 每页条数
        in: query
        maximum: 1000
        minimum: 10
        name: page_size
        required: true
        type: integer
      - description: 开始时间
        in: query
        name: start_time
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 100000,success
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lyonmu_kaguya_internal_dto_code.Response'
            - properties:
                code:
                  type: number
                data:
                  $ref: '#/definitions/system.SystemAccessLogListResp'
                message:
                  type: string
              type: object
      summary: SystemAccessLogPage
      tags:
      - System
  /v1/system/model:
    post:
      parameters:
      - description: 请求参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/system.SystemModelSaveReq'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lyonmu_kaguya_internal_dto_code.Response'
            - properties:
                data:
                  $ref: '#/definitions/system.SystemModelResp'
              type: object
      summary: 创建模型
      tags:
      - System Model
  /v1/system/model/{id}:
    delete:
      parameters:
      - description: 模型 ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_lyonmu_kaguya_internal_dto_code.Response'
      summary: 删除模型
      tags:
      - System Model
    get:
      parameters:
      - description: 模型 ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lyonmu_kaguya_internal_dto_code.Response'
            - properties:
                data:
                  $ref: '#/definitions/system.SystemModelResp'
              type: object
      summary: 获取模型详情
      tags:
      - System Model
    put:
      parameters:
      - description: 模型 ID
        in: path
        name: id
        required: true
        type: string
      - description: 请求参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/system.SystemModelSaveReq'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lyonmu_kaguya_internal_dto_code.Response'
            - properties:
                data:
                  $ref: '#/definitions/system.SystemModelResp'
              type: object
      summary: 修改模型
      tags:
      - System Model
  /v1/system/model/label:
    get:
      parameters:
      - in: query
        name: keyword
        type: string
      - in: query
        name: provider_id
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lyonmu_kaguya_internal_dto_code.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/system.SystemModelLabelResp'
                  type: array
              type: object
      summary: 获取模型下拉选项
      tags:
      - System Model
  /v1/system/model/page:
    get:
      parameters:
      - enum:
        - -1
        - 1
        - 2
        in: query
        name: is_default
        type: integer
        x-enum-varnames:
        - IsUnknown
        - IsTrue
        - IsFalse
      - in: query
        name: keyword
        type: string
      - default: 1
        in: query
        minimum: 1
        name: page
        required: true
        type: integer
      - default: 10
        in: query
        maximum: 1000
        minimum: 10
        name: page_size
        required: true
        type: integer
      - in: query
        name: provider_id
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lyonmu_kaguya_internal_dto_code.Response'
            - properties:
                data:
                  $ref: '#/definitions/system.SystemModelListResp'
              type: object
      summary: 获取模型分页列表
      tags:
      - System Model
  /v1/system/provider:
    post:
      parameters:
      - description: 请求参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/system.SystemProviderSaveReq'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lyonmu_kaguya_internal_dto_code.Response'
            - properties:
                data:
                  $ref: '#/definitions/system.SystemProviderResp'
              type: object
      summary: 创建提供商
      tags:
      - System Provider
  /v1/system/provider/{id}:
    delete:
      parameters:
      - description: 提供商 ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_lyonmu_kaguya_internal_dto_code.Response'
      summary: 删除提供商及其模型
      tags:
      - System Provider
    get:
      parameters:
      - description: 提供商 ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lyonmu_kaguya_internal_dto_code.Response'
            - properties:
                data:
                  $ref: '#/definitions/system.SystemProviderResp'
              type: object
      summary: 获取提供商详情
      tags:
      - System Provider
    put:
      parameters:
      - description: 提供商 ID
        in: path
        name: id
        required: true
        type: string
      - description: 请求参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/system.SystemProviderSaveReq'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lyonmu_kaguya_internal_dto_code.Response'
            - properties:
                data:
                  $ref: '#/definitions/system.SystemProviderResp'
              type: object
      summary: 修改提供商
      tags:
      - System Provider
  /v1/system/provider/label:
    get:
      parameters:
      - in: query
        name: keyword
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lyonmu_kaguya_internal_dto_code.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/system.SystemProviderLabelResp'
                  type: array
              type: object
      summary: 获取提供商下拉选项
      tags:
      - System Provider
  /v1/system/provider/page:
    get:
      parameters:
      - enum:
        - openai-chat
        - anthropic
        - openai-response
        in: query
        name: api_protocol
        type: string
        x-enum-varnames:
        - ProtocolOpenAIChat
        - ProtocolAnthropic
        - ProtocolOpenAIResponses
      - default: 1
        in: query
        minimum: 1
        name: page
        required: true
        type: integer
      - default: 10
        in: query
        maximum: 1000
        minimum: 10
        name: page_size
        required: true
        type: integer
      - in: query
        name: provider_name
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lyonmu_kaguya_internal_dto_code.Response'
            - properties:
                data:
                  $ref: '#/definitions/system.SystemProviderListResp'
              type: object
      summary: 获取提供商分页列表
      tags:
      - System Provider
schemes:
- http
swagger: "2.0"
