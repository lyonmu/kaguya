            - properties:
                data:
                  $ref: '#/definitions/system.SystemMCPResp'
              type: object
      summary: 创建 MCP 配置（默认停用）
      tags:
      - System MCP
  /v1/system/mcp/{id}:
    delete:
      parameters:
      - description: MCP ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/code.Response'
