basePath: /kaguya/api
definitions:
  chat.BlockPhase:
    enum:
    - start
    - delta
    - block_end
    type: string
    x-enum-varnames:
    - BlockPhaseStart
    - BlockPhaseDelta
    - BlockPhaseEnd
  chat.BlockType:
    enum:
    - text
    - reasoning
    - tool_call
    - tool_result
    type: string
    x-enum-varnames:
    - BlockTypeText
    - BlockTypeReasoning
    - BlockTypeToolCall
    - BlockTypeToolResult
  chat.Chat:
    properties:
      block:
        allOf:
        - $ref: '#/definitions/chat.ContentBlock'
        description: delta 帧的内容块事件；整轮 done 不携带内容
      content:
        description: 兼容字段：仅正文增量，与 block.text 二选一消费
        type: string
      flag:
        $ref: '#/definitions/chat.WSFlag'
      id:
        description: 会话雪花 ID；后续请求沿用此 ID 恢复上下文
        type: string
    type: object
  chat.ChatReq:
    properties:
      flag:
        $ref: '#/definitions/chat.WSFlag'
      id:
        description: 会话ID，空值表示开启新对话
        type: string
      messages:
        type: string
      model_id:
        description: 本地模型记录 ID，空值使用全局默认模型
        type: string
    required:
    - flag
    - messages
    type: object
  chat.ChatResp:
    properties:
      api_protocol:
        allOf:
        - $ref: '#/definitions/consts.ProviderProtocol'
        description: api接口类型
      chat:
        allOf:
        - $ref: '#/definitions/chat.Chat'
        description: 对话信息
      created:
        description: 创建时间时间戳
        type: integer
      err:
        description: 错误信息
      model_id:
        description: 模型id
        type: string
      model_name:
        description: 模型名称
        type: string
      usage:
        allOf:
        - $ref: '#/definitions/chat.Usage'
        description: token 使用信息
    type: object
  chat.ContentBlock:
    properties:
      error_message:
        type: string
      input:
        type: string
      is_error:
        type: boolean
      output:
        $ref: '#/definitions/chat.ToolOutput'
      phase:
        $ref: '#/definitions/chat.BlockPhase'
      provider_executed:
        type: boolean
      text:
        type: string
      tool_call_id:
        type: string
      tool_name:
        type: string
      type:
        $ref: '#/definitions/chat.BlockType'
    type: object
  chat.ConversationContextResp:
    properties:
      context_tokens:
        type: integer
      context_window:
        type: integer
      conversation_id:
        type: string
      effective_window:
        type: integer
      max_window_percent:
        type: number
      model_id:
        type: string
      model_name:
        type: string
      percent:
        type: number
      turn_index:
        type: integer
      window_ratio:
        type: number
    type: object
  chat.ConversationListResp:
    properties:
      items:
        items:
          $ref: '#/definitions/chat.ConversationResp'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  chat.ConversationResp:
    properties:
      created_at:
        type: string
      duration_ms:
        type: integer
      favorite:
        type: boolean
      id:
        type: string
      last_message_at:
        type: string
      model_id:
        type: string
      model_name:
        type: string
      title:
        description: AI 标题最多20字符；每轮 done 后仍为“新对话”时，由前端 POST title/wait 使用全局任务模型生成或重试
        type: string
      tool_calls:
        type: integer
      turn_count:
        type: integer
      usage:
        allOf:
        - $ref: '#/definitions/chat.Usage'
        description: 仅累计已完成轮次
    type: object
  chat.ConversationTitleResp:
    properties:
      id:
        type: string
      title:
        description: 当前已保存标题；生成失败或等待超时保留原标题
        type: string
    type: object
  chat.ConversationUpdateReq:
    properties:
      favorite:
        type: boolean
      title:
        maxLength: 200
        minLength: 1
        type: string
    type: object
  chat.StoredBlock:
    properties:
      end_order:
        type: integer
      error_message:
        type: string
      finished_at:
        type: string
      input:
        type: string
      is_error:
        type: boolean
      output:
        $ref: '#/definitions/chat.ToolOutput'
      provider_executed:
        type: boolean
      sequence:
        description: 轮内展示顺序；与 turn_index 联合排序
        type: integer
      start_order:
        description: Trace 按事件序号还原并行开始/结束顺序
        type: integer
      started_at:
        type: string
      text:
        type: string
      tool_call_id:
        type: string
      tool_name:
        type: string
      type:
        $ref: '#/definitions/chat.BlockType'
    type: object
  chat.StoredTurn:
    properties:
      api_protocol:
        type: string
      blocks:
        items:
          $ref: '#/definitions/chat.StoredBlock'
        type: array
      duration_ms:
        type: integer
      finish_reason:
        type: string
      finished_at:
        type: string
      model_id:
        type: string
      model_name:
        type: string
      provider_name:
        type: string
      started_at:
        type: string
      tool_calls:
        type: integer
      turn_index:
        description: 仅历史分页/排序使用，不改变实时 DTO
        type: integer
      usage:
        $ref: '#/definitions/chat.Usage'
      user_content:
        type: string
    type: object
  chat.ToolOutput:
    properties:
      data:
        description: base64 媒体数据
        type: string
      media_type:
        type: string
      text:
        type: string
      type:
        $ref: '#/definitions/chat.ToolOutputType'
    type: object
  chat.ToolOutputType:
    enum:
    - text
    - error
    - media
    type: string
    x-enum-varnames:
    - ToolOutputText
    - ToolOutputError
    - ToolOutputMedia
  chat.TurnListResp:
    properties:
      has_more:
        type: boolean
      items:
        description: 按 turn_index 升序，每轮 blocks 按 sequence 升序
        items:
          $ref: '#/definitions/chat.StoredTurn'
        type: array
      next_before:
        description: 向前加载更早轮次的游标
        type: integer
      page:
        description: 页码模式为实际页码；游标模式为 0
        type: integer
      page_size:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  chat.Usage:
    properties:
      cached_tokens:
        description: 命中缓存的 Token 数
        type: integer
      input_tokens:
        description: 输入 Token 数。
        type: integer
      output_tokens:
        description: 输出 Token 数
        type: integer
      reasoning_tokens:
        description: 思考 Token 数（提供商未报告时为 0）
        type: integer
      total_tokens:
        description: 总 Token 数
        type: integer
    type: object
  chat.WSFlag:
    enum:
    - chat
    - cancel
    - start
    - delta
    - done
    - error
    type: string
    x-enum-comments:
      WSFlagCancel: 上行：取消当前生成
      WSFlagChat: 上行：发起一轮对话
      WSFlagDelta: 下行：增量内容帧
      WSFlagDone: 下行：唯一的本轮结束帧，仅携带 Usage，不重复内容
      WSFlagError: 下行：出错或被取消
      WSFlagStart: 下行：本轮首帧（会话 ID + 模型信息）
    x-enum-descriptions:
    - 上行：发起一轮对话
    - 上行：取消当前生成
    - 下行：本轮首帧（会话 ID + 模型信息）
    - 下行：增量内容帧
    - 下行：唯一的本轮结束帧，仅携带 Usage，不重复内容
    - 下行：出错或被取消
    x-enum-varnames:
    - WSFlagChat
    - WSFlagCancel
    - WSFlagStart
    - WSFlagDelta
    - WSFlagDone
    - WSFlagError
  consts.ProviderProtocol:
    enum:
    - openai-chat
    - anthropic
    - openai-response
    type: string
    x-enum-varnames:
    - ProtocolOpenAIChat
    - ProtocolAnthropic
    - ProtocolOpenAIResponses
  consts.ProviderType:
    enum:
    - normal
    - opencode-go
    type: string
    x-enum-varnames:
    - ProviderTypeNormal
    - ProviderTypeOpenCodeGo
  consts.ReasoningEffort:
    enum:
    - low
    - medium
    - high
    type: string
    x-enum-varnames:
    - ReasoningEffortLow
    - ReasoningEffortMedium
    - ReasoningEffortHigh
  consts.Status:
    enum:
    - -1
    - 1
    - 2
    type: integer
    x-enum-varnames:
    - IsUnknown
    - IsTrue
    - IsFalse
  github_com_lyonmu_kaguya_internal_dto_code.Response:
    properties:
      code:
        example: 100000
        type: integer
      data: {}
      message:
        example: success
        type: string
    type: object
  system.SystemAccessLogListResp:
    properties:
      items:
        description: 操作日志列表
        items:
          $ref: '#/definitions/system.SystemAccessLogResp'
        type: array
      page:
        description: 页码
        type: integer
      page_size:
        description: 每页条数
        type: integer
      total:
        description: 总条数
        type: integer
    type: object
  system.SystemAccessLogResp:
    properties:
      access_ip:
        description: 访问IP
        type: string
      access_time:
        description: 操作时间
        type: integer
      browser_engine_name:
        description: 浏览器引擎名称
        type: string
      browser_engine_version:
        description: 浏览器引擎版本
        type: string
      browser_name:
        description: 浏览器名称
        type: string
      browser_version:
        description: 浏览器版本
        type: string
      id:
        description: ID
        type: string
      os:
        description: 操作系统
        type: string
      platform:
        description: 操作平台
        type: string
    type: object
  system.SystemInfoResp:
    properties:
      default_model_id:
        maxLength: 64
        type: string
      global_system_prompt:
        description: 只读基础人设，与自定义提示词拼接后用于聊天
        type: string
      system_prompt:
        maxLength: 20000
        type: string
      task_model_id:
        maxLength: 64
        type: string
      user_agent:
        maxLength: 512
        type: string
    required:
    - user_agent
    type: object
  system.SystemInfoSaveReq:
    properties:
      default_model_id:
        maxLength: 64
        type: string
      system_prompt:
        maxLength: 20000
        type: string
      task_model_id:
        maxLength: 64
        type: string
      user_agent:
        maxLength: 512
        type: string
    required:
    - user_agent
    type: object
  system.SystemModelLabelResp:
    properties:
      label:
        type: string
      model_id:
        type: string
      provider_id:
        type: string
      provider_name:
        type: string
      value:
        type: string
    type: object
  system.SystemModelListResp:
    properties:
      items:
        items:
          $ref: '#/definitions/system.SystemModelResp'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  system.SystemModelResp:
    properties:
      capability_structured_output:
        $ref: '#/definitions/consts.Status'
      capability_tool_use:
        $ref: '#/definitions/consts.Status'
      capability_vision:
        $ref: '#/definitions/consts.Status'
      created_at:
        type: string
      id:
        type: string
      model_id:
        type: string
      model_name:
        type: string
      provider_id:
        type: string
      provider_name:
        type: string
      reasoning_effort:
        $ref: '#/definitions/consts.ReasoningEffort'
      reasoning_enabled:
        $ref: '#/definitions/consts.Status'
      token_context_window:
        type: integer
      token_max_output_tokens:
        type: integer
      updated_at:
        type: string
    type: object
  system.SystemModelSaveReq:
    properties:
      capability_structured_output:
        allOf:
        - $ref: '#/definitions/consts.Status'
        enum:
        - 1
        - 2
      capability_tool_use:
        allOf:
        - $ref: '#/definitions/consts.Status'
        enum:
        - 1
        - 2
      capability_vision:
        allOf:
        - $ref: '#/definitions/consts.Status'
        enum:
        - 1
        - 2
      model_id:
        type: string
      model_name:
        type: string
      provider_id:
        type: string
      reasoning_effort:
        allOf:
        - $ref: '#/definitions/consts.ReasoningEffort'
        enum:
        - low
        - medium
        - high
      reasoning_enabled:
        allOf:
        - $ref: '#/definitions/consts.Status'
        enum:
        - 1
        - 2
      token_context_window:
        minimum: 0
        type: integer
      token_max_output_tokens:
        minimum: 0
        type: integer
    required:
    - capability_structured_output
    - capability_tool_use
    - capability_vision
    - model_id
    - model_name
    - provider_id
    - reasoning_effort
    - reasoning_enabled
    type: object
  system.SystemProviderLabelResp:
    properties:
      label:
        type: string
      value:
        type: string
    type: object
  system.SystemProviderListResp:
    properties:
      items:
        items:
          $ref: '#/definitions/system.SystemProviderResp'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  system.SystemProviderResp:
    properties:
      api_key:
        type: string
      api_protocol:
        $ref: '#/definitions/consts.ProviderProtocol'
      base_url:
        type: string
      created_at:
        type: string
      id:
        type: string
      models:
        items:
          $ref: '#/definitions/system.SystemModelResp'
        type: array
      provider_name:
        type: string
      provider_type:
        $ref: '#/definitions/consts.ProviderType'
      updated_at:
        type: string
    type: object
  system.SystemProviderSaveReq:
    properties:
      api_key:
        description: API Key
        type: string
      api_protocol:
        allOf:
        - $ref: '#/definitions/consts.ProviderProtocol'
        description: API 协议类型
        enum:
        - openai-chat
        - anthropic
        - openai-response
      base_url:
        description: 完整请求 URL，必须包含实际端点；不补全或裁剪路径
        type: string
      provider_name:
        description: 提供商名称
        type: string
      provider_type:
        allOf:
        - $ref: '#/definitions/consts.ProviderType'
        enum:
        - normal
        - opencode-go
    required:
    - api_protocol
    - base_url
    - provider_name
    type: object
  system.TokenUsageComposition:
    properties:
      cached_tokens:
        type: integer
      id:
        type: string
      input_tokens:
        type: integer
      name:
        type: string
      output_tokens:
        type: integer
      provider_id:
        type: string
      provider_name:
        type: string
      reasoning_tokens:
        type: integer
      total_tokens:
        type: integer
    type: object
  system.TokenUsageDay:
    properties:
      conversations:
        type: integer
      date:
        type: string
      total_tokens:
        type: integer
    type: object
  system.TokenUsageResp:
    properties:
      conversations:
        type: integer
      days:
        items:
          $ref: '#/definitions/system.TokenUsageDay'
        type: array
      end:
        type: string
      models:
        items:
          $ref: '#/definitions/system.TokenUsageComposition'
        type: array
      peak_conversations:
        type: integer
      peak_conversations_date:
        type: string
      peak_tokens:
        type: integer
      peak_tokens_date:
        type: string
      providers:
        items:
          $ref: '#/definitions/system.TokenUsageComposition'
        type: array
      start:
        type: string
      total_tokens:
        type: integer
    type: object
host: http://localhost:9024
info:
  contact:
    email: lyonmu@foxmail.com
    name: Lyon Mu
    url: https://github.com/lyonmu
  description: kaguya 后端
  license:
    name: MIT
    url: https://github.com/lyonmu/kaguya/blob/master/LICENSE
  title: kaguya Swagger API接口文档
  version: v0.0.1
paths:
  /v1/chat/conversation/{id}:
    delete:
      parameters:
      - description: 会话雪花 ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_lyonmu_kaguya_internal_dto_code.Response'
      summary: 软删除会话（删除后不可查询或续聊）
      tags:
      - Chat History
    get:
      parameters:
      - description: 会话雪花 ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lyonmu_kaguya_internal_dto_code.Response'
            - properties:
                data:
                  $ref: '#/definitions/chat.ConversationResp'
              type: object
      summary: 会话摘要与累计运行信息（Overview）
      tags:
      - Chat History
    put:
      parameters:
      - description: 会话雪花 ID
        in: path
        name: id
        required: true
        type: string
      - description: 至少提供 title 或 favorite
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/chat.ConversationUpdateReq'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lyonmu_kaguya_internal_dto_code.Response'
            - properties:
                data:
                  $ref: '#/definitions/chat.ConversationResp'
              type: object
      summary: 修改会话标题或收藏状态
      tags:
      - Chat History
  /v1/chat/conversation/{id}/context:
    get:
      description: 累计所有已完成轮次的 total_tokens（含跨模型和工具 step），分母为最新完整轮次模型窗口的90%；不代表实际上下文占用，不裁剪消息。无累计用量或模型窗口时
        percent 为 null。
      parameters:
      - description: 会话 ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lyonmu_kaguya_internal_dto_code.Response'
            - properties:
                data:
                  $ref: '#/definitions/chat.ConversationContextResp'
              type: object
      summary: 整个会话累计 token 占比
      tags:
      - Chat History
  /v1/chat/conversation/{id}/title/wait:
    get:
      description: 兼容等待接口，不启动生成任务；无任务时直接返回当前标题。仅等待当前进程的任务，最多30秒。新客户端应使用 POST 接口生成标题。不存在或已删除会话返回会话不存在。
      parameters:
      - description: 会话雪花 ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lyonmu_kaguya_internal_dto_code.Response'
            - properties:
                data:
                  $ref: '#/definitions/chat.ConversationTitleResp'
              type: object
      summary: 等待已有标题任务并返回已保存标题
      tags:
      - Chat History
    post:
      description: 每轮成功结束且标题仍为“新对话”时调用一次。使用全局任务模型根据已保存首轮问答生成标题，未配置任务模型返回 102007。已有任务则等待，不覆盖非默认标题。最多等待30秒，生成失败或等待超时返回当前标题，不自动重试；聊天主流程不自动生成标题。
      parameters:
      - description: 会话雪花 ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lyonmu_kaguya_internal_dto_code.Response'
            - properties:
                data:
                  $ref: '#/definitions/chat.ConversationTitleResp'
              type: object
      summary: 默认标题生成或重试，并等待已保存标题
      tags:
      - Chat History
  /v1/chat/conversation/{id}/turns:
    get:
      description: page>0 时按时间正序分页（越界页定位末页），与 before 互斥；返回 total/page/page_size/total_pages。page=0
        兼容原游标：首屏最新 limit 轮，用 next_before 向前加载。has_more 表示仍有更早轮次。所有结果与 blocks 均正序；工具输入输出合并，不返回模型私有
        metadata。
      parameters:
      - description: 会话雪花 ID
        in: path
        name: id
        required: true
        type: string
      - description: 上页 next_before；0 表示最新
        in: query
        minimum: 0
        name: before
        type: integer
      - in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: 1 起按时间正序分页；0 使用原有 before 游标，与 before 互斥
        in: query
        maximum: 1000000
        minimum: 0
        name: page
        type: integer
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lyonmu_kaguya_internal_dto_code.Response'
            - properties:
                data:
                  $ref: '#/definitions/chat.TurnListResp'
              type: object
      summary: 按原始执行顺序读取完整轮次（聊天/Trace/工具详情）
      tags:
      - Chat History
  /v1/chat/conversation/page:
    get:
      description: 按最近完整轮次时间倒序；支持标题前缀搜索、收藏筛选。新建会话仍使用 SSE/WS 空 id 请求，首次成功后才出现在列表中。
      parameters:
      - in: query
        name: favorite
        type: boolean
      - description: 标题前缀搜索（走索引）
        in: query
        maxLength: 200
        name: keyword
        type: string
      - in: query
        maximum: 1000000
        minimum: 1
        name: page
        type: integer
      - in: query
        maximum: 100
        minimum: 1
