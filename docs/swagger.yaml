basePath: /kaguya/api
definitions:
  chat.Chat:
    properties:
      content:
        description: 模型返回的内容
        type: string
      id:
        description: 对话id
        type: string
    type: object
  chat.ChatReq:
    properties:
      conversation_id:
        description: 会话ID，空值表示开启新对话
        type: string
      messages:
        type: string
    required:
    - messages
    type: object
  chat.ChatSSEResp:
    properties:
      api_protocol:
        allOf:
        - $ref: '#/definitions/consts.ProviderProtocol'
        description: api接口类型
      chat:
        allOf:
        - $ref: '#/definitions/chat.Chat'
        description: 对话信息
      created:
        description: 创建时间时间戳
        type: integer
      err:
        description: 错误信息
      model_id:
        description: 模型id
        type: string
      model_name:
        description: 模型名称
        type: string
      usage:
        allOf:
        - $ref: '#/definitions/chat.Usage'
        description: token 使用信息
    type: object
  chat.ChatWSResp:
    properties:
      data:
        $ref: '#/definitions/chat.ChatSSEResp'
      flag:
        $ref: '#/definitions/chat.WSFlag'
    type: object
  chat.Usage:
    properties:
      cached_tokens:
        description: 命中缓存的 Token 数
        type: integer
      input_tokens:
        description: 输入 Token 数。
        type: integer
      output_tokens:
        description: 输出 Token 数
        type: integer
      total_tokens:
        description: 总 Token 数
        type: integer
    type: object
  chat.WSFlag:
    enum:
    - chat
    - cancel
    - start
    - delta
    - done
    - error
    type: string
    x-enum-comments:
      WSFlagCancel: 上行：取消当前生成
      WSFlagChat: 上行：发起一轮对话
      WSFlagDelta: 下行：增量内容帧
      WSFlagDone: 下行：本轮末帧（完整回答 + Usage）
      WSFlagError: 下行：出错或被取消
      WSFlagStart: 下行：本轮首帧（会话 ID + 模型信息）
    x-enum-descriptions:
    - 上行：发起一轮对话
    - 上行：取消当前生成
    - 下行：本轮首帧（会话 ID + 模型信息）
    - 下行：增量内容帧
    - 下行：本轮末帧（完整回答 + Usage）
    - 下行：出错或被取消
    x-enum-varnames:
    - WSFlagChat
    - WSFlagCancel
    - WSFlagStart
    - WSFlagDelta
    - WSFlagDone
    - WSFlagError
  consts.ProviderProtocol:
    enum:
    - openai-chat
    - anthropic
    - openai-response
    type: string
    x-enum-varnames:
    - ProtocolOpenAIChat
    - ProtocolAnthropic
    - ProtocolOpenAIResponses
  github_com_lyonmu_kaguya_internal_dto_code.Response:
    properties:
      code:
        example: 100000
        type: integer
      data: {}
      message:
        example: success
        type: string
    type: object
  system.SystemAccessLogListResp:
    properties:
      items:
        description: 操作日志列表
        items:
          $ref: '#/definitions/system.SystemAccessLogResp'
        type: array
      page:
        description: 页码
        type: integer
      page_size:
        description: 每页条数
        type: integer
      total:
        description: 总条数
        type: integer
    type: object
  system.SystemAccessLogResp:
    properties:
      access_ip:
        description: 访问IP
        type: string
      access_time:
        description: 操作时间
        type: integer
      browser_engine_name:
        description: 浏览器引擎名称
        type: string
      browser_engine_version:
        description: 浏览器引擎版本
        type: string
      browser_name:
        description: 浏览器名称
        type: string
      browser_version:
        description: 浏览器版本
        type: string
      id:
        description: ID
        type: string
      os:
        description: 操作系统
        type: string
      platform:
        description: 操作平台
        type: string
    type: object
host: http://localhost:9024
info:
  contact:
    email: lyonmu@foxmail.com
    name: Lyon Mu
    url: https://github.com/lyonmu
  description: kaguya 后端
  license:
    name: MIT
    url: https://github.com/lyonmu/kaguya/blob/master/LICENSE
  title: kaguya Swagger API接口文档
  version: v0.0.1
paths:
  /v1/chat/sse:
    post:
      description: 简单SSE对话：流式返回模型回答，首帧携带会话ID与模型信息，末帧携带完整内容与token用量
      parameters:
      - description: 用户发起的对话（conversation_id 为空时开启新对话）
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/chat.ChatReq'
      produces:
      - application/json
      responses:
        "200":
          description: SSE 流式响应，每帧为一个 ChatSSEResp
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lyonmu_kaguya_internal_dto_code.Response'
            - properties:
                code:
                  type: number
                data:
                  $ref: '#/definitions/chat.ChatSSEResp'
                message:
                  type: string
              type: object
      summary: ChatSSE
      tags:
      - Chat
  /v1/chat/ws:
    get:
      description: WebSocket 流式对话：长连接多轮对话。上行帧 ChatWSReq（flag=chat/cancel），下行帧 dtocode.Response
        包 ChatWSResp（flag=start/delta/done/error）
      produces:
      - application/json
      responses:
        "200":
          description: WS 帧，每帧为一个 dtocode.Response
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lyonmu_kaguya_internal_dto_code.Response'
            - properties:
                code:
                  type: number
                data:
                  $ref: '#/definitions/chat.ChatWSResp'
                message:
                  type: string
              type: object
      summary: ChatWS
      tags:
      - Chat
  /v1/system/accesslog/page:
    get:
      description: 获取访问日志分页列表
      parameters:
      - description: 访问IP
        in: query
        name: access_ip
        type: string
      - description: 结束时间
        in: query
        name: end_time
        type: integer
      - default: 1
        description: 页码
        in: query
        minimum: 1
        name: page
        required: true
        type: integer
      - default: 10
        description: 每页条数
        in: query
        maximum: 1000
        minimum: 10
        name: page_size
        required: true
        type: integer
      - description: 开始时间
        in: query
        name: start_time
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 100000,success
          schema:
            allOf:
            - $ref: '#/definitions/github_com_lyonmu_kaguya_internal_dto_code.Response'
            - properties:
                code:
                  type: number
                data:
                  $ref: '#/definitions/system.SystemAccessLogListResp'
                message:
                  type: string
              type: object
      summary: SystemAccessLogPage
      tags:
      - System
schemes:
- http
swagger: "2.0"
