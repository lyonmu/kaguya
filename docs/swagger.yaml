        1.3。
      parameters:
      - description: TLS 配置
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/system.TLSSaveReq'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/code.Response'
            - properties:
                data:
                  $ref: '#/definitions/system.TLSInfoResp'
              type: object
