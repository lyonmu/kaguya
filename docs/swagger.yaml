components:
  schemas:
    chat.Chat:
      description: 对话信息
      properties:
        content:
          description: 模型返回的内容
          type: string
        flag:
          $ref: '#/components/schemas/chat.WSFlag'
        id:
          description: 对话id
          type: string
      type: object
    chat.ChatReq:
      properties:
        flag:
          $ref: '#/components/schemas/chat.WSFlag'
        id:
          description: 会话ID，空值表示开启新对话
          form: id
          type: string
        messages:
          form: messages
          type: string
      required:
      - flag
      - messages
      type: object
    chat.ChatResp:
      properties:
        api_protocol:
          $ref: '#/components/schemas/consts.ProviderProtocol'
        chat:
          $ref: '#/components/schemas/chat.Chat'
        created:
          description: 创建时间时间戳
          type: integer
        err:
          description: 错误信息
        model_id:
          description: 模型id
          type: string
        model_name:
          description: 模型名称
          type: string
        usage:
          $ref: '#/components/schemas/chat.Usage'
      type: object
    chat.Usage:
      description: token 使用信息
      properties:
        cached_tokens:
          description: 命中缓存的 Token 数
          type: integer
        input_tokens:
          description: 输入 Token 数。
          type: integer
        output_tokens:
          description: 输出 Token 数
          type: integer
        total_tokens:
          description: 总 Token 数
          type: integer
      type: object
    chat.WSFlag:
      enum:
      - chat
      - cancel
      - start
      - delta
      - done
      - error
      type: string
      x-enum-comments:
        WSFlagCancel: 上行：取消当前生成
        WSFlagChat: 上行：发起一轮对话
        WSFlagDelta: 下行：增量内容帧
        WSFlagDone: 下行：本轮末帧（完整回答 + Usage）
        WSFlagError: 下行：出错或被取消
        WSFlagStart: 下行：本轮首帧（会话 ID + 模型信息）
      x-enum-varnames:
      - WSFlagChat
      - WSFlagCancel
      - WSFlagStart
      - WSFlagDelta
      - WSFlagDone
      - WSFlagError
    code:
      properties:
        code:
          type: number
      type: object
    consts.ProviderProtocol:
      description: api接口类型
      enum:
      - openai-chat
      - anthropic
      - openai-response
      type: string
      x-enum-varnames:
      - ProtocolOpenAIChat
      - ProtocolAnthropic
      - ProtocolOpenAIResponses
    data:
      properties:
        data:
          $ref: '#/components/schemas/system.SystemAccessLogListResp'
      type: object
    github_com_lyonmu_kaguya_internal_dto_code.Response:
      allOf:
      - $ref: '#/components/schemas/data'
      - $ref: '#/components/schemas/message'
      - $ref: '#/components/schemas/code'
      properties:
        code:
          example: 100000
          type: integer
        data: {}
        message:
          example: success
          type: string
      type: object
    message:
      properties:
        message:
          type: string
      type: object
    system.SystemAccessLogListResp:
      properties:
        items:
          description: 操作日志列表
          items:
            $ref: '#/components/schemas/system.SystemAccessLogResp'
          type: array
          uniqueItems: false
        page:
          description: 页码
          type: integer
        page_size:
          description: 每页条数
          type: integer
        total:
          description: 总条数
          type: integer
      type: object
    system.SystemAccessLogResp:
      properties:
        access_ip:
          description: 访问IP
          type: string
        access_time:
          description: 操作时间
          type: integer
        browser_engine_name:
          description: 浏览器引擎名称
          type: string
        browser_engine_version:
          description: 浏览器引擎版本
          type: string
        browser_name:
          description: 浏览器名称
          type: string
        browser_version:
          description: 浏览器版本
          type: string
        id:
          description: ID
          type: string
        os:
          description: 操作系统
          type: string
        platform:
          description: 操作平台
          type: string
      type: object
externalDocs:
  description: ""
  url: ""
info:
  contact:
    email: lyonmu@foxmail.com
    name: Lyon Mu
    url: https://github.com/lyonmu
  description: kaguya 后端
  license:
    name: MIT
    url: https://github.com/lyonmu/kaguya/blob/master/LICENSE
  title: kaguya Swagger API接口文档
  version: v0.0.1
openapi: 3.1.0
paths:
  /v1/chat/sse:
    post:
      description: 简单SSE对话：流式返回模型回答，首帧携带会话ID与模型信息，末帧携带完整内容与token用量
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/chat.ChatReq'
              description: 用户发起的对话（conversation_id 为空时开启新对话）
              summary: data
        description: 用户发起的对话（conversation_id 为空时开启新对话）
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/data'
                - $ref: '#/components/schemas/message'
                - $ref: '#/components/schemas/code'
                properties:
                  code:
                    example: 100000
                    type: integer
                  data: {}
                  message:
                    example: success
                    type: string
                type: object
          description: SSE 流式响应，每帧为一个 ChatResp
      summary: ChatSSE
      tags:
      - Chat
  /v1/chat/ws:
    get:
      description: WebSocket 流式对话：长连接多轮对话。上行帧 ChatWSReq（flag=chat/cancel），下行帧 dtocode.Response
        包 ChatWSResp（flag=start/delta/done/error）
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/data'
                - $ref: '#/components/schemas/message'
                - $ref: '#/components/schemas/code'
                properties:
                  code:
                    example: 100000
                    type: integer
                  data: {}
                  message:
                    example: success
                    type: string
                type: object
          description: WS 帧，每帧为一个 dtocode.Response
      summary: ChatWS
      tags:
      - Chat
  /v1/system/accesslog/page:
    get:
      description: 获取访问日志分页列表
      parameters:
      - description: 访问IP
        in: query
        name: access_ip
        schema:
          description: 访问IP
          type: string
      - description: 开始时间
        in: query
        name: start_time
        schema:
          description: 开始时间
          form: start_time
          type: integer
      - description: 结束时间
        in: query
        name: end_time
        schema:
          description: 结束时间
          form: end_time
          type: integer
      - description: 页码
        in: query
        name: page
        required: true
        schema:
          default: 1
          description: 页码
          form: page
          minimum: 1
          type: integer
      - description: 每页条数
        in: query
        name: page_size
        required: true
        schema:
          default: 10
          description: 每页条数
          form: page_size
          maximum: 1000
          minimum: 10
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/data'
                - $ref: '#/components/schemas/message'
                - $ref: '#/components/schemas/code'
                properties:
                  code:
                    example: 100000
                    type: integer
                  data: {}
                  message:
                    example: success
                    type: string
                type: object
          description: 100000,success
      summary: SystemAccessLogPage
      tags:
      - System
servers:
- url: http://localhost:9024/kaguya/api
