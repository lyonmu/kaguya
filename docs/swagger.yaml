        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/code.Response'
            - properties:
                data:
                  $ref: '#/definitions/system.SystemMCPResp'
              type: object
      summary: 查询 MCP 配置详情
      tags:
      - System MCP
    put:
      parameters:
      - description: MCP ID
        in: path
        name: id
        required: true
        type: string
      - description: MCP 配置
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/system.SystemMCPSaveReq'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/code.Response'
            - properties:
                data:
                  $ref: '#/definitions/system.SystemMCPResp'
              type: object
      summary: 修改 MCP 配置，已启用的服务自动替换连接
      tags:
      - System MCP
  /v1/system/mcp/{id}/state:
    put:
      parameters:
      - description: MCP ID
        in: path
        name: id
        required: true
        type: string
      - description: 启用状态
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/system.SystemMCPStateReq'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/code.Response'
            - properties:
                data:
                  $ref: '#/definitions/system.SystemMCPResp'
              type: object
      summary: 动态启停 MCP 服务；启用异常服务时重新连接
      tags:
      - System MCP
  /v1/system/mcp/page:
    get:
      parameters:
      - in: query
        name: name
        type: string
      - in: query
        minimum: 1
        name: page
        type: integer
      - in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/code.Response'
            - properties:
                data:
                  $ref: '#/definitions/system.SystemMCPListResp'
              type: object
      summary: 分页查询 MCP 配置与运行状态（不包含环境变量和请求头）
      tags:
      - System MCP
  /v1/system/model:
    post:
      parameters:
      - description: 请求参数
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/system.SystemModelSaveReq'
