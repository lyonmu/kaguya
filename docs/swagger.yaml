          $ref: '#/definitions/system.SystemInfoSaveReq'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/code.Response'
            - properties:
                data:
                  $ref: '#/definitions/system.SystemInfoResp'
              type: object
      summary: 保存全局系统配置
      tags:
      - System Info
  /v1/system/info/tls:
    put:
