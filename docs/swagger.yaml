        description: 请求时间段起点（UTC 自然日）
        type: string
      total_tokens:
        description: 请求时间段内累计 Token
        type: integer
    type: object
host: localhost:9024
info:
  contact:
    email: lyonmu@foxmail.com
    name: Lyon Mu
    url: https://github.com/lyonmu
  description: kaguya 后端
  license:
    name: MIT
    url: https://github.com/lyonmu/kaguya/blob/master/LICENSE
  title: kaguya Swagger API接口文档
  version: v0.0.1
paths:
  /v1/chat/conversation/{id}:
    delete:
      parameters:
      - description: 会话雪花 ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/code.Response'
      summary: 软删除会话（删除后不可查询或续聊）
      tags:
      - Chat History
    get:
      parameters:
      - description: 会话雪花 ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/code.Response'
            - properties:
                data:
                  $ref: '#/definitions/chat.ConversationResp'
              type: object
      summary: 会话摘要与累计运行信息（Overview）
      tags:
      - Chat History
    put:
      parameters:
      - description: 会话雪花 ID
        in: path
        name: id
        required: true
        type: string
      - description: 至少提供 title 或 favorite
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/chat.ConversationUpdateReq'
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/code.Response'
            - properties:
                data:
                  $ref: '#/definitions/chat.ConversationResp'
              type: object
      summary: 修改会话标题或收藏状态
      tags:
      - Chat History
  /v1/chat/conversation/{id}/context:
    get:
      description: 最近一次模型调用的输入（含缓存）及输出估算上下文占用，分母为模型窗口的90%；达到阈值后下一次模型调用前自动压缩。无供应商用量或模型窗口时
        percent 为 null。
      parameters:
      - description: 会话 ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/code.Response'
            - properties:
                data:
                  $ref: '#/definitions/chat.ConversationContextResp'
              type: object
      summary: 当前上下文占用
      tags:
      - Chat History
  /v1/chat/conversation/{id}/stop:
    post:
      description: 记录指定会话当前轮次是用户主动停止，使落库状态区分为 canceled 而不是断联的 interrupted。没有运行轮次时为幂等空操作；取消本身仍由客户端断开流式连接完成。
      parameters:
      - description: 会话雪花 ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/code.Response'
      summary: 标记用户主动停止
      tags:
      - Chat
  /v1/chat/conversation/{id}/title/wait:
    get:
      description: 兼容等待接口，不启动生成任务；无任务时直接返回当前标题。仅等待当前进程的任务，最多30秒。新客户端应使用 POST 接口生成标题。不存在或已删除会话返回会话不存在。
      parameters:
      - description: 会话雪花 ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/code.Response'
            - properties:
                data:
                  $ref: '#/definitions/chat.ConversationTitleResp'
              type: object
      summary: 等待已有标题任务并返回已保存标题
      tags:
      - Chat History
    post:
      description: 每轮成功结束且标题仍为“新对话”时调用一次。新会话创建后已立即并行启动同一任务（只用用户提问，不等回答），模型返回后直接条件写入标题；此处按需补生成或重试，使用全局任务模型根据已保存首轮问答生成标题。未配置任务模型返回
        102007，提供商的 API Key 无法解密返回 102010。已有任务（含提前启动的）则等待，不覆盖非默认标题。最多等待30秒，生成失败或等待超时返回当前标题，不自动重试。
      parameters:
      - description: 会话雪花 ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/code.Response'
            - properties:
                data:
                  $ref: '#/definitions/chat.ConversationTitleResp'
              type: object
      summary: 默认标题生成或重试，并等待已保存标题
      tags:
      - Chat History
  /v1/chat/conversation/{id}/turns:
    get:
      description: 默认每页5轮，上限100轮。page>0 时按时间正序分页（越界页定位末页），与 before 互斥；返回 total/page/page_size/total_pages。page=0
        使用游标：首屏最新 limit 轮，用 next_before 向前加载。compact=true 时仅正文完整返回，工具及思考块只返回元信息，details_deferred=true
        的块通过单块详情接口加载。所有结果与 blocks 均正序，不返回模型私有 metadata。
      parameters:
      - description: 会话雪花 ID
        in: path
        name: id
        required: true
        type: string
      - description: 上页 next_before；0 表示最新
        in: query
        minimum: 0
        name: before
        type: integer
      - description: 折叠的工具/思考内容由详情接口按需加载
        in: query
        name: compact
        type: boolean
      - in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - description: 1 起按时间正序分页；0 使用原有 before 游标，与 before 互斥
        in: query
        maximum: 1000000
        minimum: 0
        name: page
        type: integer
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/code.Response'
            - properties:
                data:
                  $ref: '#/definitions/chat.TurnListResp'
              type: object
      summary: 按原始执行顺序读取完整轮次（聊天/Trace/工具详情）
      tags:
      - Chat History
  /v1/chat/conversation/{id}/turns/{turn}/blocks/{sequence}:
    get:
      parameters:
      - description: 会话雪花 ID
        in: path
        name: id
        required: true
        type: string
      - description: 轮次索引
        in: path
        name: turn
        required: true
        type: integer
      - description: 轮内内容块序号
        in: path
        name: sequence
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/code.Response'
            - properties:
                data:
                  $ref: '#/definitions/chat.StoredBlock'
              type: object
      summary: 按需读取单个工具或思考内容块
      tags:
      - Chat History
  /v1/chat/conversation/page:
    get:
      description: 按最近完整轮次时间倒序；支持标题前缀搜索、收藏筛选。默认仅普通对话；is_project=true 仅项目对话，project_id
        可指定项目，不能与 is_project=false 同时使用。响应 is_project 根据当前项目归属生成。新建会话在首轮正文开始生成前即创建并出现在列表中，失败或取消的轮次保留空会话，可手动删除。
      parameters:
      - in: query
        name: favorite
        type: boolean
      - description: true 仅项目对话；false 仅普通对话；未提供时有 project_id 则按项目，否则仅普通对话
        in: query
        name: is_project
        type: boolean
      - description: 标题前缀搜索（走索引）
        in: query
        maxLength: 200
        name: keyword
        type: string
      - in: query
        maximum: 1000000
        minimum: 1
        name: page
        type: integer
      - in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      - in: query
        maxLength: 64
        name: project_id
        type: string
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/code.Response'
            - properties:
                data:
                  $ref: '#/definitions/chat.ConversationListResp'
              type: object
      summary: 会话列表（含进行中与空会话）
      tags:
      - Chat History
  /v1/chat/sse:
    post:
      description: SSE 对话：chat.id 为会话雪花 ID，后续请求沿用该 ID；chat.flag=start/delta/done/error。delta
        携带 block（text/reasoning/tool_call/tool_result），phase=start/delta/block_end。正文与思考的
        block_end 不重复内容；唯一的整轮 done 仅携带 Token 用量
      parameters:
      - description: 用户发起的对话（conversation_id 为空时开启新对话）
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/chat.ChatReq'
      produces:
      - application/json
      responses:
        "200":
          description: SSE 流式响应，每帧为一个 ChatResp
          schema:
            allOf:
            - $ref: '#/definitions/code.Response'
            - properties:
                code:
                  type: number
                data:
                  $ref: '#/definitions/chat.ChatResp'
                message:
                  type: string
              type: object
      summary: ChatSSE
      tags:
      - Chat
  /v1/chat/ws:
    get:
      description: WebSocket 流式对话：上行 flag=chat/cancel，id 沿用会话雪花 ID，project_id 仅新对话使用，files
        为项目内文件引用（最多 8 个，仅 SSE 同等的首轮引用行为）；下行 chat.flag=start/delta/done/error。delta
        携带 block（text/reasoning/tool_call/tool_result），phase=start/delta/block_end；正文与思考的
        block_end 不重复内容，唯一的整轮 done 仅携带 Usage
      produces:
      - application/json
      responses:
        "200":
          description: WS 帧，每帧为一个 dtocode.Response
          schema:
            allOf:
            - $ref: '#/definitions/code.Response'
            - properties:
                code:
                  type: number
                data:
                  $ref: '#/definitions/chat.ChatResp'
                message:
                  type: string
              type: object
      summary: ChatWS
      tags:
      - Chat
  /v1/project:
    post:
      description: 名称可重复；未删除项目的规范化绝对路径必须唯一，冲突返回业务码 107003
      parameters:
      - description: 项目信息
        in: body
