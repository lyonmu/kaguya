<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/kaguya-favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d10" />
    <meta
      name="description"
      content="Kaguya 是一位冷静、理性、可靠且始终保持克制的智能助手。"
    />
    <script>
      try {
        const savedMode = localStorage.getItem('kaguya-color-mode')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle(
          'dark',
          savedMode === 'dark' || (savedMode !== 'light' && prefersDark),
        )
      } catch (_) {
        document.documentElement.classList.add('dark')
      }
    </script>
    <title>Kaguya</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
